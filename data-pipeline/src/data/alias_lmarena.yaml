  "Claude 3 Haiku": anthropic/claude-3-haiku

  # ── Google version aliases ──
  "Gemini-2.5-Pro-Preview-05-06": google/gemini-2.5-pro
  "Gemini-2.5-Pro-Exp-03-25": google/gemini-2.5-pro
  "Gemini-2.0-Flash-001": google/gemini-2.0-flash-001
  "Gemini-2.0-Flash-Exp": google/gemini-2.0-flash-001
  "Gemini-Exp-1206": google/gemini-exp-1206
