# Manual alias overrides for LMArena → canonical OpenRouter ID alignment.
#
# This file handles edge cases that automatic vendor + name normalization
# cannot resolve. Examples:
#   - Code-named preview models ("chocolate" → "x-ai/grok-3")
#   - Marketing names that diverge from API IDs
#     ("ChatGPT-4o-latest (2025-03-26)" → "openai/chatgpt-4o-latest")
#
# Keys are the EXACT LMArena `model` field (case-sensitive, including
# parenthesized suffixes). Values are canonical OpenRouter IDs.
#
# Set value to `null` to indicate "intentionally skip"
# (e.g. models not on OpenRouter at all, like research-only checkpoints).
#
# Update workflow:
#   1. Run `uv run python -m src.build` — pipeline logs unmatched LMArena entries
#   2. Inspect logs, decide alignment for each
#   3. Add entry here, re-run pipeline

aliases:
  # ── OpenAI marketing/version aliases ──
  "ChatGPT-4o-latest (2025-03-26)": openai/chatgpt-4o-latest
  "ChatGPT-4o-latest (2024-09-03)": openai/chatgpt-4o-latest
  "GPT-4-Turbo-2024-04-09": openai/gpt-4-turbo
  "GPT-4-1106-preview": openai/gpt-4-turbo-preview
  "GPT-4-0125-preview": openai/gpt-4-turbo-preview
  "GPT-4-0314": openai/gpt-4
  "GPT-4-0613": openai/gpt-4
  "GPT-3.5-Turbo-0125": openai/gpt-3.5-turbo
  "GPT-3.5-Turbo-1106": openai/gpt-3.5-turbo
  "GPT-3.5-Turbo-0613": openai/gpt-3.5-turbo
  "GPT-3.5-Turbo-0314": openai/gpt-3.5-turbo

  # ── xAI code-named preview models ──
  "chocolate (Early Grok-3)": x-ai/grok-3
  "Grok-3-Preview-02-24": x-ai/grok-3
  "early-grok-3": x-ai/grok-3

  # ── Anthropic version aliases ──
  "Claude 3.5 Sonnet (20241022)": anthropic/claude-3.5-sonnet
  "Claude 3.5 Sonnet (20240620)": anthropic/claude-3.5-sonnet
  "Claude 3.5 Haiku (20241022)": anthropic/claude-3.5-haiku
  "Claude 3 Opus": anthropic/claude-3-opus
